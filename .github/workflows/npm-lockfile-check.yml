name: NPM Lockfile Check

# 这个 fork 不跑上游的 lockfile 检查。push 到 main 会把它带红，改成手动触发。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: npm ci --ignore-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package-lock.json is in sync
        run: npm ci --ignore-scripts
